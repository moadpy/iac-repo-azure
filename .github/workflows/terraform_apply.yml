name: Terraform Apply

on:
  push:
    branches:
      - dev
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment (preprod or prod)"
        required: true
        default: "preprod"
        type: choice
        options:
          - preprod
          - prod

permissions:
  contents: read

env:
  TF_VERSION: "1.7.5"
  # TF_STATE_RG is resolved at runtime by discovering the sandbox's existing RG
  # SP credentials for Terraform provider (tenant + subscription resolved at runtime)
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
  TF_VAR_github_token: ${{ secrets.GH_TOKEN }}
  TF_VAR_github_webhook_secret: ${{ secrets.GH_WEBHOOK_SECRET }}

jobs:
  terraform-apply:
    name: Apply
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure SSH key for Dev VM
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEV_VM_SSH_PUBLIC_KEY }}" > ~/.ssh/id_rsa.pub

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "name=${{ inputs.environment }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            echo "name=prod" >> "$GITHUB_OUTPUT"
          else
            echo "name=preprod" >> "$GITHUB_OUTPUT"
          fi

      # Login as service principal using Tenant ID.
      # This avoids MFA / device-flow that blocks non-interactive user logins.
      # --allow-no-subscriptions: SP is scoped to RG only (no subscription-level role),
      # so az login would otherwise abort with "No subscriptions found".
      - name: Azure login & resolve tenant/subscription
        run: |
          az login \
            --service-principal \
            --username "${{ secrets.AZURE_CLIENT_ID }}" \
            --password "${{ secrets.AZURE_CLIENT_SECRET }}" \
            --tenant  "${{ secrets.AZURE_TENANT_ID }}" \
            --allow-no-subscriptions \
            --output none
          # SP is RG-scoped: az account list returns a tenant-level entry, not a real
          # subscription. Use the subscription ID secret directly.
          TENANT_ID=$(az account list --all --query "[0].tenantId" -o tsv)
          echo "ARM_TENANT_ID=$TENANT_ID"                                  >> "$GITHUB_ENV"
          echo "ARM_SUBSCRIPTION_ID=${{ secrets.AZURE_SUBSCRIPTION_ID }}" >> "$GITHUB_ENV"

      # ── Bootstrap: idempotent creation of Terraform state backend ──────────
      # Discover the existing sandbox RG (SP cannot create new ones).
      # Derive a deterministic storage account name from the subscription ID
      # so no extra secret is required (Azure SA names: 3-24 lowercase alphanum).
      - name: Bootstrap Terraform state backend
        run: |
          EXISTING_RG=$(az group list \
            --query "[?!starts_with(name, 'MC_')].name | [0]" \
            -o tsv)
          echo "TF_STATE_RG=$EXISTING_RG" >> "$GITHUB_ENV"

          SA_NAME="tfstate$(echo "$ARM_SUBSCRIPTION_ID" | tr -d '-' | cut -c1-17)"
          echo "TF_STATE_SA=$SA_NAME" >> "$GITHUB_ENV"

          az storage account create \
            --name "$SA_NAME" \
            --resource-group "$EXISTING_RG" \
            --sku Standard_LRS \
            --min-tls-version TLS1_2 \
            --allow-blob-public-access false \
            --output none

          SA_KEY=$(az storage account keys list \
            --account-name "$SA_NAME" \
            --resource-group "$EXISTING_RG" \
            --query "[0].value" -o tsv)

          az storage container create \
            --name tfstate \
            --account-name "$SA_NAME" \
            --account-key "$SA_KEY" \
            --output none

      - name: Terraform Init
        run: |
          SA_KEY=$(az storage account keys list \
            --account-name "$TF_STATE_SA" \
            --resource-group "$TF_STATE_RG" \
            --query "[0].value" -o tsv)

          terraform init \
            -backend-config="resource_group_name=$TF_STATE_RG" \
            -backend-config="storage_account_name=$TF_STATE_SA" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=${{ steps.env.outputs.name }}/terraform.tfstate" \
            -backend-config="access_key=$SA_KEY"

      - name: Terraform Apply
        run: |
          terraform apply \
            -var-file="environments/${{ steps.env.outputs.name }}.tfvars" \
            -auto-approve \
            -input=false