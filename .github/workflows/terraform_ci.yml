name: Terraform CI

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.7.5"
  # SP credentials for Terraform provider (tenant + subscription resolved at runtime)
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

jobs:
  terraform-ci:
    name: Validate & Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Determine environment
        id: env
        run: |
          if [[ "${{ github.base_ref }}" == "main" ]]; then
            echo "name=prod" >> "$GITHUB_OUTPUT"
          else
            echo "name=preprod" >> "$GITHUB_OUTPUT"
          fi

      # Derive tenant domain from username email, then login as service principal.
      # This avoids MFA / device-flow that blocks non-interactive user logins.
      - name: Azure login & resolve tenant/subscription
        id: azure
        run: |
          TENANT_DOMAIN=$(echo "${{ secrets.AZURE_USERNAME }}" | cut -d'@' -f2)
          az login \
            --service-principal \
            --username "${{ secrets.AZURE_CLIENT_ID }}" \
            --password "${{ secrets.AZURE_CLIENT_SECRET }}" \
            --tenant  "$TENANT_DOMAIN" \
            --output none
          TENANT_ID=$(az account show --query tenantId -o tsv)
          SUB_ID=$(az account show --query id       -o tsv)
          echo "ARM_TENANT_ID=$TENANT_ID"       >> "$GITHUB_ENV"
          echo "ARM_SUBSCRIPTION_ID=$SUB_ID"    >> "$GITHUB_ENV"
          echo "tenant_id=$TENANT_ID"           >> "$GITHUB_OUTPUT"
          echo "subscription_id=$SUB_ID"        >> "$GITHUB_OUTPUT"

      - name: Verify backend storage exists
        run: |
          az storage account show \
            --name "${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            --resource-group "rg-terraform-state" \
            --query "name" -o tsv

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group_name=rg-terraform-state" \
            -backend-config="storage_account_name=${{ secrets.TF_STATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=${{ steps.env.outputs.name }}/terraform.tfstate"

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Install TFLint
        uses: terraform-linters/setup-tflint@v4

      - name: TFLint
        run: |
          tflint --init
          tflint --recursive

      - name: Install Checkov
        run: pip install checkov

      - name: Checkov Security Scan
        run: |
          checkov -d . \
            --framework terraform \
            --soft-fail \
            --output cli \
            --compact

      - name: Terraform Plan
        id: plan
        run: |
          terraform plan \
            -var-file="environments/${{ steps.env.outputs.name }}.tfvars" \
            -out=tfplan \
            -no-color 2>&1 | tee plan_output.txt
        continue-on-error: true

      - name: Post Plan as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan_output.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.substring(0, 60000) + '\n\n... (truncated)'
              : plan;
            const body = `## Terraform Plan — \`${{ steps.env.outputs.name }}\`
            <details><summary>Show Plan</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`
            </details>

            **Status**: ${{ steps.plan.outcome }}`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });

      - name: Fail if plan errored
        if: steps.plan.outcome == 'failure'
        run: exit 1
